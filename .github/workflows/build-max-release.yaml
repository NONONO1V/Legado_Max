name: Build Max Release APK

on:
  # 只在 build/max-apk 分支推送时触发，用于出 Max 正式包（appMax / release）
  push:
    branches:
      - build/max-apk
  workflow_dispatch:

# 同一个分支连续 push 时，取消旧任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Max Release APK
        run: |
          chmod +x gradlew
          # 打 appMax 的 release 变体；签名用仓库内的 .github/workflows/legado.jks
          # （build.gradle 里 RELEASE_STORE_FILE 未设置时会自动回退到该文件）
          # 跳过 appS 的 Google Services 任务，该 flavor 在 CI 上缺少配置
          ./gradlew assembleAppMaxRelease -x processAppSReleaseGoogleServices --parallel --daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: max-release-apk
          # release 变体启用了 ABI 分拆，会产出 arm64-v8a / armeabi-v7a / universal 三个包
          path: app/build/outputs/apk/appMax/release/*.apk
          retention-days: 30
